services:
  - type: web
    name: helixprimus-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.lock.txt
    startCommand: python -m app.demo seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: AI_PROVIDER
        value: mock
      - key: DATABASE_URL
        value: sqlite:////tmp/helixprimus-demo.db
